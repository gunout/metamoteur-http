<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FTP METASEARCH — Liens HTTP directs</title>
<meta name="description" content="Métamoteur de recherche — Extraction de liens HTTP directs vers audio, vidéo et livres">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cyan: #00ffff;
    --cyan-dark: #0088aa;
    --bg: #020205;
    --panel: rgba(5, 15, 30, 0.9);
    --text: #e0faff;
    --muted: #00cccc;
    --red: #ff3333;
    --green: #00ff66;
    --orange: #ff9900;
    --purple: #ff00ff;
    --glow: 0 0 10px rgba(0, 255, 255, 0.6);
  }

  body {
    background:
      radial-gradient(circle at 15% 0%, rgba(0, 255, 255, 0.08) 0%, transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(255, 0, 255, 0.08) 0%, transparent 45%),
      var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    padding: 20px;
  }

  .container { max-width: 1200px; margin: 0 auto; }

  h1 {
    font-size: 26px;
    background: linear-gradient(90deg, #fff, var(--cyan), var(--purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 2px;
    margin-bottom: 5px;
  }
  .sub { color: var(--cyan-dark); font-size: 12px; margin-bottom: 25px; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--cyan-dark);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
    backdrop-filter: blur(10px);
  }

  label {
    display: block;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 6px;
  }

  .search-row { display: flex; gap: 10px; flex-wrap: wrap; }

  input[type="text"] {
    flex: 1;
    min-width: 240px;
    background: #000;
    border: 2px solid var(--cyan-dark);
    border-radius: 8px;
    padding: 14px 18px;
    color: var(--cyan);
    font-size: 16px;
    outline: none;
    transition: 0.2s;
  }
  input[type="text"]:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 0 3px rgba(0,255,255,0.15), var(--glow);
  }

  button {
    background: rgba(0,255,255,0.1);
    border: 1px solid var(--cyan);
    color: var(--cyan);
    padding: 14px 24px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: 0.2s;
    white-space: nowrap;
  }
  button:hover:not(:disabled) {
    background: var(--cyan);
    color: #000;
    box-shadow: 0 0 15px var(--cyan);
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.small { padding: 6px 12px; font-size: 10px; }

  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--cyan-dark);
    padding-bottom: 8px;
  }
  .panel-header h2 {
    font-size: 13px;
    color: var(--cyan);
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }

  .sources {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px;
  }
  .source {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(0,136,170,0.4);
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
    user-select: none;
  }
  .source:hover { border-color: var(--cyan); }
  .source.active {
    border-color: var(--cyan);
    background: rgba(0,255,255,0.08);
    box-shadow: 0 0 10px rgba(0,255,255,0.2);
  }
  .source input { display: none; }
  .source-check {
    width: 18px; height: 18px;
    border: 1px solid var(--cyan-dark);
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: transparent; flex-shrink: 0;
  }
  .source.active .source-check {
    background: var(--cyan); color: #000; border-color: var(--cyan);
  }
  .source-info { flex: 1; min-width: 0; }
  .source-name { font-size: 12px; font-weight: 700; color: #fff; }
  .source-desc { font-size: 10px; color: var(--muted); opacity: 0.7; }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 15px; }
  .filter {
    padding: 8px 14px;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(0,136,170,0.4);
    border-radius: 20px;
    cursor: pointer;
    font-size: 12px;
    color: var(--muted);
    transition: 0.2s;
    user-select: none;
  }
  .filter:hover { border-color: var(--cyan); color: var(--cyan); }
  .filter.active {
    background: var(--cyan); color: #000; border-color: var(--cyan);
    box-shadow: 0 0 10px rgba(0,255,255,0.4);
  }

  .stats {
    display: flex; gap: 20px; flex-wrap: wrap;
    font-size: 12px; color: var(--muted);
    margin-bottom: 12px;
  }
  .stats span { display: flex; align-items: center; gap: 5px; }

  .log {
    background: #000;
    border: 1px solid var(--cyan-dark);
    border-radius: 6px;
    padding: 10px;
    font-family: monospace;
    font-size: 11px;
    max-height: 140px;
    overflow-y: auto;
    margin-top: 10px;
  }
  .log div { margin-bottom: 3px; }
  .log .ok { color: var(--green); }
  .log .err { color: var(--red); }
  .log .info { color: var(--cyan); }
  .log .warn { color: var(--orange); }

  .results-list {
    max-height: 700px;
    overflow-y: auto;
    border: 1px solid var(--cyan-dark);
    border-radius: 6px;
  }
  .results-list::-webkit-scrollbar { width: 8px; }
  .results-list::-webkit-scrollbar-track { background: #000; }
  .results-list::-webkit-scrollbar-thumb { background: var(--cyan-dark); border-radius: 4px; }

  .result {
    display: flex;
    gap: 14px;
    padding: 14px 16px;
    border-bottom: 1px solid rgba(0,136,170,0.15);
    transition: 0.2s;
  }
  .result:hover {
    background: rgba(0,255,255,0.05);
    border-left: 3px solid var(--cyan);
    padding-left: 19px;
  }
  .result:last-child { border-bottom: none; }

  .result-icon {
    width: 48px; height: 48px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    background: rgba(0,0,0,0.4);
    border: 2px solid;
    flex-shrink: 0;
  }
  .result-icon.audio { color: var(--purple); border-color: var(--purple); }
  .result-icon.video { color: var(--red); border-color: var(--red); }
  .result-icon.book { color: var(--orange); border-color: var(--orange); }
  .result-icon.archive { color: var(--cyan); border-color: var(--cyan); }
  .result-icon.other { color: var(--muted); border-color: var(--muted); }

  .result-body { flex: 1; min-width: 0; }
  .result-title {
    color: #fff; font-weight: 600; margin-bottom: 4px;
    word-break: break-word; font-size: 14px;
  }
  .result-url {
    color: var(--cyan); font-size: 11px;
    font-family: monospace; word-break: break-all; margin-bottom: 4px;
  }
  .result-meta { color: var(--muted); font-size: 11px; opacity: 0.8; }
  .result-source {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 10px;
    background: rgba(0,255,255,0.1);
    color: var(--cyan);
    border: 1px solid var(--cyan);
    margin-top: 6px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .result-actions {
    display: flex; flex-direction: column; gap: 6px; flex-shrink: 0;
  }
  .result-actions a, .result-actions button {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--cyan-dark);
    border-radius: 6px;
    color: var(--cyan);
    text-decoration: none;
    transition: 0.2s;
    font-size: 16px;
    background: rgba(0,0,0,0.3);
    cursor: pointer;
    padding: 0;
  }
  .result-actions a:hover, .result-actions button:hover {
    background: var(--cyan); color: #000;
  }
  .result-actions a.dl { border-color: var(--green); color: var(--green); }
  .result-actions a.dl:hover { background: var(--green); color: #000; }
  .result-actions button.copy { border-color: var(--orange); color: var(--orange); }
  .result-actions button.copy:hover { background: var(--orange); color: #000; }

  .empty { text-align: center; padding: 40px; color: var(--cyan-dark); }

  .export-bar {
    display: flex; gap: 10px; flex-wrap: wrap;
    padding-top: 15px;
    border-top: 1px solid rgba(0,136,170,0.3);
    margin-top: 15px;
  }

  @media (max-width: 700px) {
    h1 { font-size: 18px; }
    .source { padding: 8px; }
    .result-icon { width: 40px; height: 40px; font-size: 18px; }
  }
</style>
</head>
<body>
<div class="container">

  <h1>🛰 FTP METASEARCH</h1>
  <div class="sub">Extraction de liens HTTP directs · Audio · Vidéo · Livres</div>

  <div class="panel">
    <label>Mot-clé (artiste, album, fichier...)</label>
    <div class="search-row">
      <input type="text" id="kw" placeholder="Ex: Nirvana, Pink Floyd, Victor Hugo..." autofocus>
      <button id="searchBtn" onclick="runSearch()">🔍 CHERCHER</button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h2>🔧 Sources</h2>
    </div>
    <div class="sources" id="sourcesGrid"></div>

    <div class="filters" id="filters">
      <div class="filter active" data-type="all">Tout</div>
      <div class="filter" data-type="audio">🎵 Audio</div>
      <div class="filter" data-type="video">🎬 Vidéo</div>
      <div class="filter" data-type="book">📚 Livres</div>
      <div class="filter" data-type="archive">📦 Archives</div>
    </div>

    <div class="log" id="log"><div class="info">&gt; Prêt. Tape un mot-clé.</div></div>
  </div>

  <div class="panel">
    <div class="stats">
      <span>🎯 <span id="count">0</span> liens HTTP</span>
      <span>⏱ <span id="time">0</span>s</span>
      <span id="sourceStats"></span>
    </div>
    <div class="results-list" id="results">
      <div class="empty">Aucun résultat. Lance une recherche.</div>
    </div>

    <div class="export-bar">
      <button class="small" onclick="exportTxt()">📄 Export TXT</button>
      <button class="small" onclick="exportCsv()">📊 Export CSV</button>
      <button class="small" onclick="exportJson()">🔧 Export JSON</button>
      <button class="small" onclick="copyAll()">📋 Copier toutes les URLs</button>
      <button class="small" onclick="clearResults()">🗑 Effacer</button>
    </div>
  </div>

</div>

<script>
'use strict';

const $ = id => document.getElementById(id);

/* =========================================================
   DETECTION TYPE
   ========================================================= */
function detectType(str) {
  const ext = (String(str).split('?')[0].split('.').pop() || '').toLowerCase();
  if (['mp3','flac','m4a','ogg','wav','aac','opus'].includes(ext)) return 'audio';
  if (['mp4','mkv','avi','webm','mov','mpg','mpeg','ogv'].includes(ext)) return 'video';
  if (['epub','pdf','mobi','azw3','djvu','txt'].includes(ext)) return 'book';
  if (['zip','rar','7z','iso','tar','gz'].includes(ext)) return 'archive';
  return 'other';
}

/* =========================================================
   SOURCES AVEC EXTRACTION DE LIENS HTTP DIRECTS
   ========================================================= */
const SOURCES = [
  {
    id: 'archive',
    name: 'Internet Archive',
    desc: 'Fichiers audio/vidéo/livres',
    enabled: true,
    async search(query) {
      // 1. Rechercher les items
      const searchUrl = 'https://archive.org/advancedsearch.php?q=' +
        encodeURIComponent(query) +
        '&fl[]=identifier&fl[]=title&fl[]=mediatype&fl[]=creator&fl[]=year' +
        '&rows=15&output=json';

      const res = await fetch(searchUrl);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const docs = data?.response?.docs || [];

      // 2. Extraire les fichiers réels via metadata API
      const results = [];
      const exts = ['mp3','flac','m4a','ogg','wav','aac','opus',
                    'mp4','mkv','avi','webm','mov','mpg','mpeg',
                    'epub','pdf','mobi','azw3','djvu','txt',
                    'zip','rar','7z','iso'];

      for (const d of docs) {
        try {
          const metaUrl = 'https://archive.org/metadata/' + d.identifier;
          const metaRes = await fetch(metaUrl);
          if (!metaRes.ok) continue;
          const meta = await metaRes.json();
          const files = meta.files || [];

          for (const f of files) {
            const name = f.name || '';
            const ext = (name.split('.').pop() || '').toLowerCase();
            if (!exts.includes(ext)) continue;

            // Construire le vrai lien HTTP direct
            const directUrl = 'https://archive.org/download/' +
              encodeURIComponent(d.identifier) + '/' +
              encodeURIComponent(name).replace(/%2F/g, '/');

            const sizeMB = f.size ? Math.round(parseInt(f.size) / 1024 / 1024) + ' MB' : '';

            results.push({
              title: name,
              url: directUrl,
              downloadUrl: directUrl,
              source: 'Internet Archive',
              type: detectType(name),
              extra: [d.title || d.identifier, sizeMB].filter(Boolean).join(' · ')
            });

            if (results.length >= 150) break;
          }
          if (results.length >= 150) break;
        } catch (e) {
          // item ignoré
        }
      }
      return results;
    }
  },
  {
    id: 'commons',
    name: 'Wikimedia Commons',
    desc: 'Fichiers libres',
    enabled: true,
    async search(query) {
      // 1. Chercher les fichiers
      const searchUrl = 'https://commons.wikimedia.org/w/api.php?action=query&list=search&srsearch=' +
        encodeURIComponent(query) + '&srnamespace=6&format=json&origin=*&srlimit=30';

      const res = await fetch(searchUrl);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const items = data?.query?.search || [];

      const exts = ['mp3','flac','m4a','ogg','wav','aac','opus',
                    'mp4','mkv','avi','webm','mov','ogv',
                    'epub','pdf','mobi','djvu'];

      // 2. Filtrer par extension
      const wanted = items.filter(r => {
        const fileTitle = r.title.replace('File:', '');
        const ext = (fileTitle.split('.').pop() || '').toLowerCase();
        return exts.includes(ext);
      }).slice(0, 20);

      if (wanted.length === 0) return [];

      // 3. Récupérer les URLs directes en batch
      const titles = wanted.map(r => r.title).join('|');
      const infoUrl = 'https://commons.wikimedia.org/w/api.php?action=query&titles=' +
        encodeURIComponent(titles) +
        '&prop=imageinfo&iiprop=url|size&format=json&origin=*';

      const infoRes = await fetch(infoUrl);
      if (!infoRes.ok) throw new Error('HTTP ' + infoRes.status);
      const infoData = await infoRes.json();
      const pages = infoData?.query?.pages || {};

      const results = [];
      for (const r of wanted) {
        const fileTitle = r.title.replace('File:', '');
        // Trouver la page correspondante
        const page = Object.values(pages).find(p =>
          p.title && p.title.replace('File:', '') === fileTitle
        );
        const directUrl = page?.imageinfo?.[0]?.url;
        if (!directUrl) continue;

        const size = page?.imageinfo?.[0]?.size;
        const sizeMB = size ? Math.round(size / 1024 / 1024) + ' MB' : '';

        results.push({
          title: fileTitle,
          url: directUrl,
          downloadUrl: directUrl,
          source: 'Wikimedia Commons',
          type: detectType(fileTitle),
          extra: sizeMB
        });
      }
      return results;
    }
  }
];

let currentFilter = 'all';
let allResults = [];

/* === LOG === */
function log(msg, cls = 'info') {
  const d = document.createElement('div');
  d.className = cls;
  d.textContent = '[' + new Date().toLocaleTimeString('fr-FR') + '] ' + msg;
  $('log').appendChild(d);
  $('log').scrollTop = $('log').scrollHeight;
}

/* === SOURCES UI === */
function renderSources() {
  const grid = $('sourcesGrid');
  grid.innerHTML = '';
  SOURCES.forEach(s => {
    const el = document.createElement('label');
    el.className = 'source' + (s.enabled ? ' active' : '');
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.checked = s.enabled;
    input.addEventListener('change', () => {
      s.enabled = input.checked;
      el.classList.toggle('active', s.enabled);
    });
    const check = document.createElement('div');
    check.className = 'source-check';
    check.textContent = '✓';
    const info = document.createElement('div');
    info.className = 'source-info';
    info.innerHTML = `<div class="source-name">${s.name}</div><div class="source-desc">${s.desc}</div>`;
    el.appendChild(input);
    el.appendChild(check);
    el.appendChild(info);
    grid.appendChild(el);
  });
}

/* === FILTRES === */
document.querySelectorAll('.filter').forEach(f => {
  f.addEventListener('click', () => {
    document.querySelectorAll('.filter').forEach(x => x.classList.remove('active'));
    f.classList.add('active');
    currentFilter = f.dataset.type;
    renderResults();
  });
});

/* === ICONES === */
function iconFor(type) {
  return type === 'audio' ? '🎵' :
         type === 'video' ? '🎬' :
         type === 'book' ? '📚' :
         type === 'archive' ? '📦' : '📄';
}

/* === RENDU === */
function renderResults() {
  const container = $('results');
  const filtered = currentFilter === 'all'
    ? allResults
    : allResults.filter(r => r.type === currentFilter);

  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty">Aucun résultat.</div>';
    $('count').textContent = '0';
    return;
  }

  container.innerHTML = '';
  filtered.forEach(r => {
    const card = document.createElement('div');
    card.className = 'result';

    const icon = document.createElement('div');
    icon.className = 'result-icon ' + r.type;
    icon.textContent = iconFor(r.type);

    const body = document.createElement('div');
    body.className = 'result-body';

    const title = document.createElement('div');
    title.className = 'result-title';
    title.textContent = r.title || r.url;
    body.appendChild(title);

    if (r.extra) {
      const meta = document.createElement('div');
      meta.className = 'result-meta';
      meta.textContent = r.extra;
      body.appendChild(meta);
    }

    const url = document.createElement('div');
    url.className = 'result-url';
    url.textContent = r.url;
    body.appendChild(url);

    const badge = document.createElement('span');
    badge.className = 'result-source';
    badge.textContent = r.source;
    body.appendChild(badge);

    const actions = document.createElement('div');
    actions.className = 'result-actions';

    const openA = document.createElement('a');
    openA.href = r.url;
    openA.target = '_blank';
    openA.rel = 'noopener';
    openA.title = 'Ouvrir';
    openA.textContent = '↗';
    actions.appendChild(openA);

    const dlA = document.createElement('a');
    dlA.href = r.downloadUrl || r.url;
    dlA.className = 'dl';
    dlA.target = '_blank';
    dlA.rel = 'noopener';
    dlA.title = 'Télécharger';
    dlA.textContent = '⬇';
    actions.appendChild(dlA);

    const copyBtn = document.createElement('button');
    copyBtn.className = 'copy';
    copyBtn.title = 'Copier l\'URL';
    copyBtn.textContent = '📋';
    copyBtn.onclick = async () => {
      try {
        await navigator.clipboard.writeText(r.url);
        log('URL copiée : ' + r.url.slice(0, 80), 'ok');
      } catch (e) {
        log('Copie impossible', 'err');
      }
    };
    actions.appendChild(copyBtn);

    card.appendChild(icon);
    card.appendChild(body);
    card.appendChild(actions);
    container.appendChild(card);
  });

  $('count').textContent = filtered.length;
}

/* === RECHERCHE === */
async function runSearch() {
  const kw = $('kw').value.trim();
  if (!kw) { alert('Tape un mot-clé.'); return; }

  const activeSources = SOURCES.filter(s => s.enabled);
  if (activeSources.length === 0) { alert('Sélectionne au moins une source.'); return; }

  $('searchBtn').disabled = true;
  $('results').innerHTML = '<div class="empty">⏳ Recherche en cours... Cela peut prendre 10-30 secondes.</div>';
  $('sourceStats').textContent = '';
  log('═══ Recherche : "' + kw + '" ═══', 'info');
  log('Sources : ' + activeSources.map(s => s.name).join(', '), 'info');

  const startTime = Date.now();
  const timer = setInterval(() => {
    $('time').textContent = Math.round((Date.now() - startTime) / 1000);
  }, 200);

  allResults = [];
  const stats = {};

  const promises = activeSources.map(async (src) => {
    try {
      log('→ ' + src.name + '...', 'info');
      const results = await src.search(kw);
      log('  ✓ ' + results.length + ' lien(s) HTTP', results.length > 0 ? 'ok' : 'warn');
      stats[src.id] = results.length;
      allResults.push(...results);
    } catch (e) {
      log('  ✗ ' + src.name + ' : ' + e.message, 'err');
      stats[src.id] = 0;
    }
  });

  await Promise.allSettled(promises);

  // Déduplication
  const seen = new Set();
  allResults = allResults.filter(r => {
    if (!r.url || seen.has(r.url)) return false;
    seen.add(r.url);
    return true;
  });

  renderResults();
  $('sourceStats').textContent = Object.entries(stats)
    .map(([k, v]) => k + ': ' + v).join(' · ');

  log('═══ Terminé : ' + allResults.length + ' lien(s) HTTP direct(s) ═══', 'ok');

  clearInterval(timer);
  $('searchBtn').disabled = false;
}

$('kw').addEventListener('keypress', e => {
  if (e.key === 'Enter') runSearch();
});

/* === EXPORTS === */
function downloadFile(content, filename, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 100);
}

function timestamp() {
  return new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
}

function exportTxt() {
  if (allResults.length === 0) return alert('Aucun résultat.');
  const txt = allResults.map(r => r.url).join('\n');
  downloadFile(txt, 'liens-http_' + timestamp() + '.txt', 'text/plain');
  log('Export TXT : ' + allResults.length + ' URLs', 'ok');
}

function exportCsv() {
  if (allResults.length === 0) return alert('Aucun résultat.');
  const rows = [['type', 'source', 'title', 'url']];
  allResults.forEach(r => {
    rows.push([
      r.type,
      r.source,
      '"' + (r.title || '').replace(/"/g, '""') + '"',
      '"' + r.url.replace(/"/g, '""') + '"'
    ]);
  });
  downloadFile(rows.map(r => r.join(',')).join('\n'), 'liens-http_' + timestamp() + '.csv', 'text/csv');
  log('Export CSV : ' + allResults.length + ' lignes', 'ok');
}

function exportJson() {
  if (allResults.length === 0) return alert('Aucun résultat.');
  downloadFile(JSON.stringify(allResults, null, 2), 'liens-http_' + timestamp() + '.json', 'application/json');
  log('Export JSON : ' + allResults.length + ' objets', 'ok');
}

async function copyAll() {
  if (allResults.length === 0) return alert('Aucun résultat.');
  const txt = allResults.map(r => r.url).join('\n');
  try {
    await navigator.clipboard.writeText(txt);
    log(allResults.length + ' URLs copiées dans le presse-papier', 'ok');
  } catch (e) {
    log('Copie impossible', 'err');
  }
}

function clearResults() {
  allResults = [];
  renderResults();
  log('Résultats effacés', 'info');
}

/* === INIT === */
renderSources();
log('Système prêt (100 % frontend).', 'ok');
log('Sources : Internet Archive (metadata API) + Wikimedia Commons (imageinfo API).', 'info');
log('Chaque fichier est extrait individuellement pour obtenir un lien HTTP direct.', 'info');
</script>
