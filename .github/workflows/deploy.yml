name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: node -c server.js
      - name: Test health endpoint
        run: |
          node server.js &
          sleep 3
          curl -f http://localhost:3000/health || exit 1
          kill %1
